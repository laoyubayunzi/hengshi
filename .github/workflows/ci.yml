name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 说明：本工作流只做"编译 + 正确性 + 溯源 + 报告结构"四项。
# 不把 t 值/收敛性作为门禁——缓存侧信道测量对调度噪声极敏感，
# 在共享 runner 上必然不稳定。完整实验属于手动/自托管任务（见 README「实验环境」）。

jobs:
  build-and-check:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 编译（MSVC）
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: SM4 标准测试向量
        shell: pwsh
        run: |
          $out = & .\hengshi.exe verify
          $out | Write-Output
          if ($out -notmatch 'OK' -or $out -match 'FAIL') { throw 'SM4 标准向量未通过' }

      - name: 第三方源码溯源校验
        shell: pwsh
        run: |
          python .\tools\check_provenance.py

      - name: 生成快速报告（小样本，仅验证生成链路）
        shell: pwsh
        run: |
          python .\make_report.py --quick
          python .\make_findings.py

      - name: 报告结构校验
        shell: pwsh
        run: |
          python .\tools\check_schema.py

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-artifacts
          path: |
            report.json
            report.md
            findings.json
            findings.md
          if-no-files-found: warn
