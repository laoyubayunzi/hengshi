name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 边界说明：
# 本工作流只验证「能编译、算法正确、源码可溯源、报告链路可用」。
# **不执行任何计时的侧信道实验**——共享 runner 的调度噪声会让 t 值不可信，
# 把 t 值当门禁只会得到一个随机红的流水线。
# 完整实验（libs / compare / ttest / converge / attack / sweep）属于手动或自托管机器任务，
# 见 .github/workflows/experiment.yml。

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Windows runner 的默认 stdout 是 cp1252，中文输出会抛 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - name: 环境自检
        shell: pwsh
        run: |
          Write-Output "== runner =="
          $PSVersionTable | Out-String | Write-Output
          Write-Output "== git 行尾配置 =="
          git config --get core.autocrlf
          Write-Output "== 第三方源码行尾（i/=索引 w/=工作区）=="
          git ls-files --eol src/thirdparty/ | Write-Output
          Write-Output "== Python =="
          python --version

      - name: 编译（MSVC）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: SM4 标准测试向量
        shell: pwsh
        run: |
          # 注意：$out 是字符串数组，对数组用 -notmatch 得到的是"元素过滤"而不是布尔值，
          # 直接放进 if 会恒为真。这里改为看退出码 + 单字符串匹配。
          $out = & .\hengshi.exe verify
          $out | Write-Output
          $code = $LASTEXITCODE
          $text = ($out | Out-String)
          $expected = '681edf34d206965e86b3e94f536e4246'
          if ($code -ne 0) { throw "verify 退出码 $code" }
          if ($text -notmatch $expected) { throw "未找到期望密文 $expected" }
          if ($text -match 'FAIL') { throw '输出包含 FAIL' }
          Write-Output "SM4 标准向量通过（exit 0）"

      - name: 依赖预检
        shell: pwsh
        run: python .\tools\check_deps.py

      - name: 单元测试（C 内核，确定性）
        shell: pwsh
        run: |
          # 直接调 cl，避免依赖 build.ps1 的产物
          $vcvars = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\*\*\VC\Auxiliary\Build\vcvars64.bat' |
            Select-Object -First 1 -ExpandProperty FullName
          cmd /c "call `"$vcvars`" >nul 2>&1 && cl /nologo /utf-8 /O2 /MT /Fe:tests\test_sm4.exe tests\test_sm4.c src\sm4.c"
          if ($LASTEXITCODE -ne 0) { throw "单元测试编译失败" }
          & .\tests\test_sm4.exe
          if ($LASTEXITCODE -ne 0) { throw "C 单元测试失败" }

      - name: dudect 对照 harness 冒烟
        shell: pwsh
        run: |
          # build.ps1 已生成 tests\dudect_harness.exe；这里确认它能跑
          if (-not (Test-Path tests\dudect_harness.exe)) { throw "harness 未生成" }
          $out = & .\tests\dudect_harness.exe ours_tt 40000 10000
          $out | Select-Object -Last 2 | Write-Output
          if (-not ($out -match 'DUDECT impl=')) { throw "harness 输出异常" }

      - name: 单元测试（Python 解析器，确定性）
        shell: pwsh
        run: |
          python .\tests\test_parsers.py
          if ($LASTEXITCODE -ne 0) { throw "解析器单元测试失败" }

      - name: 第三方源码溯源校验
        shell: pwsh
        run: python .\tools\check_provenance.py

      - name: 生成报告（夹具模式，不跑计时实验）
        shell: pwsh
        run: |
          python .\make_report.py --smoke
          python .\make_findings.py --in report.smoke.json --out findings.smoke.json

      - name: 报告结构校验
        shell: pwsh
        run: |
          python .\tools\check_schema.py --report report.smoke.json --findings findings.smoke.json
          python .\tools\check_docs.py

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-smoke
          path: |
            report.smoke.json
            report.smoke.md
            findings.smoke.json
            findings.smoke.md
            *.obj
          if-no-files-found: warn
